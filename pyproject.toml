[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "universal-ai-memory"
version = "0.2.0"
description = "Authenticated local-first memory with encrypted payloads and clear vectors"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "mcp==1.12.4",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[project.scripts]
universal-memory-api = "universal_memory.api:main"
universal-memory-mcp = "universal_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_memory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"openapi.yaml" = "universal_memory/openapi.yaml"
